# docker compose up --build
#   web  http://localhost:3000   chat UI (nginx, proxies /api)
#   api  http://localhost:8080   Go API (also serves the UI itself)
#   db   Postgres 16, seeded once from data/datasets.jsonl.gz
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: egov
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-egov}
      POSTGRES_DB: egov
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U egov -d egov"]
      interval: 3s
      timeout: 3s
      retries: 20

  seed:
    build: .
    image: ask-data-egov:local
    command: ["seed", "-if-empty"]
    environment:
      DATABASE_URL: postgres://egov:${POSTGRES_PASSWORD:-egov}@db:5432/egov?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    image: ask-data-egov:local
    environment:
      DATABASE_URL: postgres://egov:${POSTGRES_PASSWORD:-egov}@db:5432/egov?sslmode=disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AGENT_MODEL: ${AGENT_MODEL:-claude-opus-5-5}
      AGENT_EFFORT: ${AGENT_EFFORT:-medium}
      AGENT_FALLBACKS: ${AGENT_FALLBACKS:-true}
      EGOV_API_KEY: ${EGOV_API_KEY:-}
      CHAT_RATE_PER_MIN: ${CHAT_RATE_PER_MIN:-10}
      CHAT_DAILY_LIMIT: ${CHAT_DAILY_LIMIT:-0}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      seed:
        condition: service_completed_successfully

  web:
    build: ./web
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      - api

volumes:
  pgdata:
